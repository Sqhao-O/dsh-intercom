name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets needs the full tag history: `changeset tag` skips
          # versions whose tags already exist, and the version PR diffs
          # CHANGELOG.md entries against earlier releases.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build
          pnpm test
          git diff --exit-code lib/

      - name: Create release PR or tag
        uses: changesets/action@v1
        with:
          # No npm publish: dsh plugins install from GitHub. Tagging the
          # released versions is enough. changeset tag creates the tags
          # locally (skipping versions already tagged) but never pushes
          # them, and action@v1 only auto-pushes tags it detects from
          # `changeset publish` output, so push the tags explicitly.
          publish: pnpm exec changeset tag && git push --tags
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
