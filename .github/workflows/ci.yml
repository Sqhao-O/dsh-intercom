name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Smoke test compiled broker
        run: node tests/smoke.mjs

      - name: Verify committed build artifacts are in sync
        run: git diff --exit-code lib/

  # TEMPORARY DEBUG JOB — remove before merge. Reproduces the unix-only
  # node:test hang with diagnostic reports (SIGUSR2) and process/FD dumps.
  debug-unix-hang:
    name: debug unix test hang
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reproduce the hang with diagnostics
        shell: bash
        run: |
          mkdir -p /tmp/reports
          rm -f /tmp/broker-tee.log
          export NODE_OPTIONS="--report-on-signal --report-signal=SIGUSR2 --report-directory=/tmp/reports"
          export DSH_INTERCOM_TEST_TEE=/tmp/broker-tee.log

          dump_diagnostics() {
            echo "=== processes ==="
            ps -eo pid,ppid,etime,stat,wchan:32,args || true
            echo "=== per-node-proc kernel state ==="
            for pid in $(pgrep -f "node|esbuild" || true); do
              echo "--- pid $pid ---"
              cat "/proc/$pid/wchan" 2>/dev/null || true; echo
              grep -E "State|VmRSS|Threads|Sig" "/proc/$pid/status" 2>/dev/null || true
              ls -l "/proc/$pid/fd" 2>/dev/null || true
              echo "--- kernel stack $pid ---"
              sudo -n cat "/proc/$pid/stack" 2>/dev/null || cat "/proc/$pid/stack" 2>/dev/null || true
              for t in /proc/$pid/task/*/stack; do
                sudo -n cat "$t" 2>/dev/null || cat "$t" 2>/dev/null || true
              done
            done
            echo "=== limits of test child ==="
            for pid in $(pgrep -f "tests/intercom.integration" || true); do
              grep -E "open files|processes" "/proc/$pid/limits" 2>/dev/null || true
            done
            echo "=== broker tee log ==="
            cat /tmp/broker-tee.log 2>/dev/null || true
            echo "=== broker sockets ==="
            find /tmp -maxdepth 4 -name "*.sock" 2>/dev/null || true
            echo "=== sending SIGUSR2 for diagnostic reports ==="
            pkill -SIGUSR2 -f "intercom.integration" || true
            sleep 2
            pkill -SIGUSR2 -f "tsx" || true
            sleep 5
            ls -la /tmp/reports || true
            for f in /tmp/reports/*.json; do
              [ -e "$f" ] || continue
              echo "=== report: $f ==="
              node -e "const r=require('$f');console.log(JSON.stringify({cmdline:r.header&&r.header.commandLine,execArgv:r.header&&r.header.execArgv,stack:r.javascriptStack&&r.javascriptStack.stack,libuv:(r.libuv||[]).slice(0,50)},null,1))" || head -c 4000 "$f" || true
            done
          }

          run_with_watchdog() {
            local label="$1"; shift
            echo "=== starting: $label ==="
            "$@" &
            local pid=$!
            local i
            for i in $(seq 1 30); do
              sleep 10
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid"
                local rc=$?
                echo "=== $label exited rc=$rc ==="
                return "$rc"
              fi
            done
            echo "=== $label STILL RUNNING after 300s — hang reproduced ==="
            dump_diagnostics
            pkill -9 -f "tsx" || true
            pkill -9 -f "broker" || true
            return 42
          }

          run_with_watchdog "integration file alone" pnpm exec tsx --test tests/intercom.integration.test.ts
          single_rc=$?
          if [ "$single_rc" -eq 0 ]; then
            run_with_watchdog "full pnpm test" pnpm test
          fi
